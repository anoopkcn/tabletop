[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabletop-dataset"
version = "2.0.0"
description = "A complete 294,912-state factor grid of one object on a table, in colour, in depth and in words"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Anoop Kaithalikunnel Chandran", email = "anoopkcn@gmail.com" }]
keywords = [
    "dataset",
    "disentanglement",
    "multimodal",
    "representation-learning",
    "synthetic-data",
    "rgb-d",
    "vision-language",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24", "h5py>=3.8"]

[project.optional-dependencies]
figures = ["pillow>=10.0"]
dev = ["pillow>=10.0", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/anoopkcn/tabletop"
Source = "https://github.com/anoopkcn/tabletop"
Issues = "https://github.com/anoopkcn/tabletop/issues"

[project.scripts]
tabletop-render = "tabletop.render:main"

[tool.hatch.build.targets.wheel]
packages = ["tabletop"]

[tool.hatch.build.targets.sdist]
include = ["tabletop", "scripts", "tests", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"
